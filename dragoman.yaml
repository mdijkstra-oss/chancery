# The service table for the backend, mounted read-only. It replaces dragoman's
# embedded table wholesale, so this file is the complete list of prefixes a
# model alias in config/models.yaml may name.
#
# `auth` is the name of the environment variable holding a key, never a key. The
# variables named here are set on the dragoman service in compose.yaml and
# nowhere else.

openai:
  endpoint: https://api.openai.com/v1
  protocol: openai-responses
  auth: OPENAI_API_KEY

anthropic:
  endpoint: https://api.anthropic.com/v1
  protocol: anthropic-messages
  auth: ANTHROPIC_API_KEY

gemini:
  endpoint: https://generativelanguage.googleapis.com/v1beta
  protocol: gemini-interactions
  auth: GEMINI_API_KEY

deepseek:
  endpoint: https://api.deepseek.com
  protocol: openai-completions
  auth: DEEPSEEK_API_KEY
  no_schema: true
